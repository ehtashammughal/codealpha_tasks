name: quote_app
description: Random Quote Generator (Flutter + Drift + Riverpod).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.0

  # Networking
  dio: ^5.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for Drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true